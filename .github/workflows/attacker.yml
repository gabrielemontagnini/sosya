name: Attacker image

# Builds the attacker box image on native runners (no QEMU) and publishes it to GHCR as
# ghcr.io/gabrielemontagnini/sosya-attacker:<version>, for linux/amd64 and linux/arm64.
# Called by release.yml before the PyPI publish, and runnable by hand.

on:
  workflow_call:
    inputs:
      version:
        description: Image tag, the package version without the leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (default, the __version__ in src/sosya/__init__.py)
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REPOSITORY: ghcr.io/gabrielemontagnini/sosya-attacker
  IMAGE_SOURCE: https://github.com/gabrielemontagnini/sosya
  # The builder's BuildKit, pinned by tag and digest like the actions.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the version
        id: version
        env:
          WANTED: ${{ inputs.version }}
        run: |
          version="${WANTED:-$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sosya/__init__.py)}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "not a release version: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build natively and push by digest
        # A docker-container builder writes OCI media types, which the merged index needs for
        # its annotations. It does not load the image into the local engine.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx create --name sosya --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx inspect --bootstrap sosya | grep -E "^BuildKit version: +v0\.34\.2$"
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output "type=image,name=$REPOSITORY,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true" \
            --metadata-file metadata.json \
            src/sosya/attacker
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "no digest in the build metadata: '$digest'" >&2
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          mkdir -p digests
          echo "$digest" > "digests/${{ matrix.arch }}"
      - name: Smoke test the published image
        # Pulled back by digest: the builder did not load it locally.
        run: |
          image="$REPOSITORY@$DIGEST"
          docker pull "$image"
          docker run --rm --entrypoint bash "$image" -c '
            set -euo pipefail
            nmap --version | head -1
            socat -V | grep -m1 "socat version"
            for tool in microsocks sosya-forward sosya-relay curl redis-cli; do
              command -v "$tool"
            done
          '
          test "$(docker image inspect --format '{{ .Architecture }}' "$image")" = "${{ matrix.arch }}"
          label=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")
          test "$label" = "$IMAGE_SOURCE"
      - name: Hand the digest to the merge job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish the multi-platform tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          amd64=$(cat digests/amd64)
          arm64=$(cat digests/arm64)
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$IMAGE_SOURCE" \
            --annotation "index:org.opencontainers.image.description=Attacker box for Sosya ranges" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --tag "$REPOSITORY:$VERSION" \
            "$REPOSITORY@$amd64" \
            "$REPOSITORY@$arm64"
      - name: Check the OCI index
        run: |
          raw=$(docker buildx imagetools inspect --raw "$REPOSITORY:$VERSION")
          echo "$raw" | jq .
          test "$(echo "$raw" | jq -r .mediaType)" = "application/vnd.oci.image.index.v1+json"
          test "$(echo "$raw" | jq -r '.annotations["org.opencontainers.image.source"]')" = "$IMAGE_SOURCE"
          platforms=$(echo "$raw" | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
          echo "platforms: $platforms"
          test "$platforms" = "linux/amd64,linux/arm64"
          kinds=$(echo "$raw" | jq -r '[.manifests[].mediaType] | unique | join(",")')
          test "$kinds" = "application/vnd.oci.image.manifest.v1+json"
