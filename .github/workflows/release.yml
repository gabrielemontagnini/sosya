name: Release

# Tag vX.Y.Z (or vX.Y.ZrcN, aN, bN): attacker image on GHCR, then PyPI, then the GitHub release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches __version__
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sosya/__init__.py)
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check that CHANGELOG.md has the release notes
        # Before anything is published: a missing section stops the release here.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-notes.sh "$VERSION" > /dev/null

  attacker:
    needs: version
    # A called workflow cannot have more permissions than the job that calls it.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/attacker.yml
    with:
      version: ${{ needs.version.outputs.version }}

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Build
        run: uv build
      - name: Smoke test the wheel
        run: uv run --isolated --no-project --with dist/*.whl sosya --version
      - name: Check that the catalog index ships in the wheel and the sdist
        run: |
          unzip -l dist/*.whl | grep -q ' sosya/catalog/data/index.json$'
          tar -tzf dist/*.tar.gz | grep -q '/src/sosya/catalog/data/index.json$'
      - name: Search the catalog from the installed wheel
        run: uv run --isolated --no-project --with dist/*.whl sosya catalog struts2
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    # PyPI never gets a version whose attacker image is not on GHCR.
    needs: [build, attacker]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - name: Publish
        run: uv publish

  github-release:
    # Only once PyPI has the version.
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          .github/scripts/release-notes.sh "$VERSION" > notes.md
          if [ "$PRERELEASE" = "true" ]; then
            kind=--prerelease
          else
            kind=--latest
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Sosya $VERSION" \
            --notes-file notes.md \
            "$kind"
