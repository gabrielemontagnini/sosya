[project]
name = "sosya"
dynamic = ["version"]
description = "Describe a hacking lab in plain English. Get it running, isolated and verified."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/sosya/catalog/data/VULHUB-LICENSE"]
requires-python = ">=3.12"
keywords = ["cyber-range", "security", "lab", "docker", "llm", "ctf", "vulhub", "training"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
    "rich>=15.0",
    "typer>=0.29",
]

[project.scripts]
sosya = "sosya.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sosya/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not docker and not llm'"
markers = [
    "docker: needs a running Docker daemon",
    "llm: calls a real LLM (run through ~/.local/bin/with-llm-key)",
]
