# Generated by sosya from range.yaml. Do not edit: run `sosya up` again instead.
name: sosya-lab
services:
  fpm:
    image: nginx:1
    volumes:
    - /work/.sosya/ranges/lab/files/fpm/www:/usr/share/nginx/html
    - /work/.sosya/ranges/lab/files/fpm/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
    - fpm-php
    platform: linux/amd64
    networks:
      dmz: {}
      fpm-net:
        aliases:
        - nginx
    labels:
      sosya.range: lab
      sosya.host: fpm
      sosya.role: target
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  fpm-php:
    image: vulhub/php:7.2.10-fpm
    volumes:
    - /work/.sosya/ranges/lab/files/fpm/www:/var/www/html
    platform: linux/amd64
    networks:
      fpm-net:
        aliases:
        - php
    labels:
      sosya.range: lab
      sosya.host: fpm
      sosya.role: target
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  attacker:
    image: ghcr.io/gabrielemontagnini/sosya-attacker:test
    hostname: attacker
    init: true
    sysctls:
      net.ipv4.ip_forward: '0'
    networks:
      dmz: {}
      egress: {}
    labels:
      sosya.range: lab
      sosya.host: attacker
      sosya.role: attacker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  dmz:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      sosya.range: lab
  fpm-net:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      sosya.range: lab
  egress:
    labels:
      sosya.range: lab
