# Generated by sosya from range.yaml. Do not edit: run `sosya up` again instead.
name: sosya-lab
services:
  blog:
    image: vulhub/wordpress:4.6
    depends_on:
    - blog-mysql
    environment:
    - WORDPRESS_DB_HOST=mysql:3306
    - WORDPRESS_DB_USER=root
    - WORDPRESS_DB_PASSWORD=root
    - WORDPRESS_DB_NAME=wordpress
    platform: linux/amd64
    networks:
      dmz: {}
      blog-net:
        aliases:
        - web
    labels:
      sosya.range: lab
      sosya.host: blog
      sosya.role: target
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  blog-mysql:
    image: mysql:5
    environment:
    - MYSQL_ROOT_PASSWORD=root
    platform: linux/amd64
    networks:
      blog-net:
        aliases:
        - mysql
    labels:
      sosya.range: lab
      sosya.host: blog
      sosya.role: target
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  attacker:
    image: ghcr.io/gabrielemontagnini/sosya-attacker:test
    hostname: attacker
    init: true
    sysctls:
      net.ipv4.ip_forward: '0'
    networks:
      dmz: {}
      egress: {}
    labels:
      sosya.range: lab
      sosya.host: attacker
      sosya.role: attacker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  dmz:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      sosya.range: lab
  blog-net:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      sosya.range: lab
  egress:
    labels:
      sosya.range: lab
