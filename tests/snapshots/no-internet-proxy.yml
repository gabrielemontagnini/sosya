# Generated by sosya from range.yaml. Do not edit: run `sosya up` again instead.
name: sosya-lab
services:
  web:
    image: vulhub/struts2:2.3.30
    platform: linux/amd64
    networks:
      dmz: {}
      internal: {}
    labels:
      sosya.range: lab
      sosya.host: web
      sosya.role: target
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cache:
    image: vulhub/redis:4.0.14
    platform: linux/amd64
    networks:
      internal: {}
    labels:
      sosya.range: lab
      sosya.host: cache
      sosya.role: target
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  attacker:
    image: ghcr.io/gabrielemontagnini/sosya-attacker:test
    hostname: attacker
    init: true
    sysctls:
      net.ipv4.ip_forward: '0'
    networks:
      dmz: {}
      relay:
        aliases:
        - attacker-link
    labels:
      sosya.range: lab
      sosya.host: attacker
      sosya.role: attacker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  attacker-relay:
    image: ghcr.io/gabrielemontagnini/sosya-attacker:test
    network_mode: service:attacker
    init: true
    command:
    - sosya-forward
    - --socks
    - '1080'
    healthcheck:
      test:
      - CMD
      - test
      - -f
      - /tmp/sosya-ready
      interval: 1s
      timeout: 3s
      retries: 60
    labels:
      sosya.range: lab
      sosya.role: relay
      sosya.host: attacker-relay
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  relay:
    image: ghcr.io/gabrielemontagnini/sosya-attacker:test
    hostname: relay
    init: true
    sysctls:
      net.ipv4.ip_forward: '0'
    command:
    - sosya-relay
    - '1080'
    networks:
      relay: {}
      proxy: {}
    ports:
    - 127.0.0.1:1080:1080
    depends_on:
      attacker-relay:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - test
      - -f
      - /tmp/sosya-ready
      interval: 1s
      timeout: 3s
      retries: 60
    labels:
      sosya.range: lab
      sosya.role: relay
      sosya.host: relay
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  dmz:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      sosya.range: lab
  internal:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      sosya.range: lab
  relay:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      sosya.range: lab
  proxy:
    enable_ipv6: false
    labels:
      sosya.range: lab
